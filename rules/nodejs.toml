[[rules]]
id = "NODE-001"
name = "Malicious postinstall script"
description = "npm lifecycle scripts (postinstall, preinstall, install) can execute arbitrary code when the package is installed. This is a common malware vector."
severity = "Critical"
language = "NodeJs"
pattern = { type = "ScriptKey", keys = ["postinstall", "preinstall", "install"] }

[[rules]]
id = "NODE-002"
name = "Obfuscated JavaScript"
description = "Detects common obfuscation patterns: eval(atob(...)), hex-encoded strings, and packed/mangled code that hides intent."
severity = "High"
language = "NodeJs"
pattern = { type = "Regex", value = 'eval\s*\(\s*atob|\\x[0-9a-fA-F]{2}|_0x[0-9a-fA-F]+' }

[[rules]]
id = "NODE-003"
name = "Suspicious outbound network call"
description = "Detects hardcoded external IP addresses in source code, which may indicate data exfiltration."
severity = "High"
language = "NodeJs"
pattern = { type = "Regex", value = 'https?://(?:10|172|192)\.[0-9]{1,3}' }

[[rules]]
id = "NODE-004"
name = "Shell execution in source"
description = "Calls to exec(), execSync(), spawn(), or child_process are commonly used to run arbitrary system commands."
severity = "High"
language = "NodeJs"
pattern = { type = "Regex", value = "require\\(['\"]child_process['\"]\\)|execSync|spawnSync" }

[[rules]]
id = "NODE-005"
name = "Hardcoded secret or token"
description = "Detects patterns matching API keys, tokens, or private keys committed directly in source."
severity = "Critical"
language = "NodeJs"
pattern = { type = "Regex", value = "(?i)(api_key|secret|token|private_key)\\s*=\\s*['\"][A-Za-z0-9_\\-]{16,}" }

[[rules]]
id = "NODE-006"
name = "Typosquatting risk in package.json"
description = "Flags dependency names with a Levenshtein distance of 1 from a known popular package (e.g. 'expres', 'lodahs')."
severity = "Medium"
language = "NodeJs"
pattern = { type = "TypoSquat", known_packages = ["express", "lodash", "react", "axios", "moment", "webpack", "babel", "typescript", "eslint", "prettier"] }

[[rules]]
id = "NODE-007"
name = "Credential file access"
description = "Reads sensitive credential files (~/.ssh, ~/.aws, ~/.gnupg, ~/.npmrc, ~/.netrc), a common pattern for credential exfiltration in malicious npm packages."
severity = "Critical"
language = "NodeJs"
pattern = { type = "Regex", value = "readFileSync\\s*\\(['\"].*(?:\\.ssh|\\.aws|\\.gnupg|\\.npmrc|\\.netrc)|readFile\\s*\\(['\"].*(?:\\.ssh|\\.aws|\\.gnupg|\\.npmrc|\\.netrc)" }

[[rules]]
id = "NODE-008"
name = "Dynamic eval alternative"
description = "Uses new Function(), setTimeout(string), or setInterval(string) to execute dynamic code — common obfuscation techniques that bypass static eval detection."
severity = "High"
language = "NodeJs"
pattern = { type = "Regex", value = "new\\s+Function\\s*\\(|setTimeout\\s*\\(\\s*['\"]|setInterval\\s*\\(\\s*['\"]" }

[[rules]]
id = "NODE-009"
name = "Prototype pollution"
description = "Mutates Object.prototype or accesses __proto__ directly, enabling silent injection of properties into every downstream object in the process."
severity = "High"
language = "NodeJs"
pattern = { type = "Regex", value = 'Object\.prototype\.|__proto__\s*\[' }

[[rules]]
id = "NODE-010"
name = "Env variable exfiltration"
description = "Combines process.env access with a network primitive (fetch, http, axios, request) on the same line — a strong indicator of credential exfiltration."
severity = "Critical"
language = "NodeJs"
pattern = { type = "Regex", value = 'process\.env.*(?:fetch|http|axios|request)|(?:fetch|http|axios|request).*process\.env' }

[[rules]]
id = "NODE-011"
name = "Expanded lifecycle hooks"
description = "Detects the full set of npm lifecycle scripts that execute automatically during install or publish, including prepare, prepack, and postpack which bypass postinstall-only defences."
severity = "Critical"
language = "NodeJs"
pattern = { type = "ScriptKey", keys = ["postinstall", "preinstall", "prepare", "install", "prepack", "postpack"] }

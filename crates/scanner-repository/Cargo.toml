[package]
name = "scanner-repository"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tempfile = "3"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["macros"] }
